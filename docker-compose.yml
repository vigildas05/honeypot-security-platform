# Local all-in-one development stack. For real deployments use
# deploy/sensor/ and deploy/backend/ instead.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-honeypot}
      POSTGRES_USER: ${POSTGRES_USER:-honeypot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-honeypot_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-honeypot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      NODE_ENV: development
      BACKEND_PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-honeypot}:${POSTGRES_PASSWORD:-honeypot_password}@postgres:5432/${POSTGRES_DB:-honeypot}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-me-dev-only-change-me}
      DASHBOARD_ADMIN_USERNAME: ${DASHBOARD_ADMIN_USERNAME:-admin}
      DASHBOARD_ADMIN_PASSWORD: ${DASHBOARD_ADMIN_PASSWORD:-admin123}
      DASHBOARD_DEMO_USERNAME: ${DASHBOARD_DEMO_USERNAME:-demo}
      DASHBOARD_DEMO_PASSWORD: ${DASHBOARD_DEMO_PASSWORD:-demo-password}
      # One token per sensor; the backend binds each event's sensor_id to its token.
      SENSOR_TOKENS: dev-http:${HTTP_SENSOR_TOKEN:-dev-http-sensor-token},dev-ssh:${SSH_SENSOR_TOKEN:-dev-ssh-sensor-token}
      # Legacy shared token still accepted on POST /attack and /ingest.
      HONEYPOT_API_TOKEN: ${HONEYPOT_API_TOKEN:-dev-honeypot-token}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "node src/db/migrate.js && node src/server.js"

  # Correlation, threat-intel enrichment and the SOC agent. Same image as the
  # backend. LLM and threat-intel keys are optional and only ever given here.
  worker:
    build: ./backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-honeypot}:${POSTGRES_PASSWORD:-honeypot_password}@postgres:5432/${POSTGRES_DB:-honeypot}
      # Liveness endpoint on localhost so the image's HEALTHCHECK works for the worker too.
      WORKER_HEALTH_PORT: 8000
      INCIDENT_WINDOW_MINUTES: ${INCIDENT_WINDOW_MINUTES:-30}
      AGENT_DEBOUNCE_SECONDS: ${AGENT_DEBOUNCE_SECONDS:-15}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_DAILY_CALL_BUDGET: ${LLM_DAILY_CALL_BUDGET:-200}
      LLM_DAILY_TOKEN_BUDGET: ${LLM_DAILY_TOKEN_BUDGET:-300000}
      NEVER_BLOCK_IPS: ${NEVER_BLOCK_IPS:-}
      BLOCK_MAX_TTL_HOURS: ${BLOCK_MAX_TTL_HOURS:-168}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      GREYNOISE_API_KEY: ${GREYNOISE_API_KEY:-}
      IPINFO_TOKEN: ${IPINFO_TOKEN:-}
    depends_on:
      backend:
        condition: service_healthy
    command: ["node", "src/worker.js"]

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  http-honeypot:
    build:
      context: ./honeypots
      dockerfile: http/Dockerfile
    environment:
      NODE_ENV: development
      HTTP_HONEYPOT_PORT: 8080
      SENSOR_ID: dev-http
      SENSOR_INGEST_URL: http://backend:8000/ingest/v1/events
      SENSOR_INGEST_TOKEN: ${HTTP_SENSOR_TOKEN:-dev-http-sensor-token}
    ports:
      - "8080:8080"
    depends_on:
      - backend

  ssh-honeypot:
    build:
      context: ./honeypots
      dockerfile: ssh/Dockerfile
    environment:
      NODE_ENV: development
      SSH_HONEYPOT_PORT: 2222
      SENSOR_ID: dev-ssh
      SENSOR_INGEST_URL: http://backend:8000/ingest/v1/events
      SENSOR_INGEST_TOKEN: ${SSH_SENSOR_TOKEN:-dev-ssh-sensor-token}
    volumes:
      - ssh-hostkey:/data
    ports:
      - "2222:2222"
    depends_on:
      - backend

volumes:
  postgres-data:
  ssh-hostkey:
