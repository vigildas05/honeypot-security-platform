apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: security-platform
data:
  NODE_ENV: "production"
  BACKEND_PORT: "8000"
  CORS_ORIGINS: "http://localhost:30080"
  TRUST_PROXY: "1"
  EDL_AUTH_MODE: "token"
  INCIDENT_WINDOW_MINUTES: "30"
  AGENT_DEBOUNCE_SECONDS: "120"
  EVENT_RETENTION_DAYS: "30"
  INCIDENT_RETENTION_DAYS: "90"
  BLOCK_MAX_TTL_HOURS: "168"
