apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: security-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: honeypot-backend:local
          imagePullPolicy: Never
          command: ["sh", "-c", "npm run migrate && npm start"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: honeypot-config
            - secretRef:
                name: honeypot-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: security-platform
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
