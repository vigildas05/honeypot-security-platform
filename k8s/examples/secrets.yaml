# EXAMPLE ONLY. Never commit real values. Create the secrets with kubectl instead:
#
#   kubectl -n security-platform create secret generic backend-secrets \
#     --from-literal=DATABASE_URL='postgresql://honeypot:<pw>@postgres:5432/honeypot' \
#     --from-literal=POSTGRES_PASSWORD='<pw>' \
#     --from-literal=JWT_SECRET_KEY="$(openssl rand -base64 48)" \
#     --from-literal=SENSOR_TOKENS="k8s-ssh:$SSH_TOKEN,k8s-http:$HTTP_TOKEN" \
#     --from-literal=DASHBOARD_ADMIN_PASSWORD='<12+ chars>' \
#     --from-literal=EDL_TOKEN="$(openssl rand -base64 30)"
#
# Sensors get ONLY their own ingest token (they refuse to start with backend secrets):
#   kubectl -n security-platform create secret generic sensor-ssh-token --from-literal=SENSOR_INGEST_TOKEN="$SSH_TOKEN"
#   kubectl -n security-platform create secret generic sensor-http-token --from-literal=SENSOR_INGEST_TOKEN="$HTTP_TOKEN"
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: security-platform
type: Opaque
stringData:
  DATABASE_URL: "postgresql://honeypot:CHANGE_ME@postgres:5432/honeypot"
  POSTGRES_PASSWORD: "CHANGE_ME"
  JWT_SECRET_KEY: "CHANGE_ME_TO_48_RANDOM_BYTES"
  SENSOR_TOKENS: "k8s-ssh:CHANGE_ME,k8s-http:CHANGE_ME"
  DASHBOARD_ADMIN_PASSWORD: "CHANGE_ME"
  EDL_TOKEN: "CHANGE_ME"
