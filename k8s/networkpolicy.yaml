# Mirrors the VM firewall design. Requires a CNI that enforces NetworkPolicy
# (e.g. Calico or Cilium).
#
# Sensors may only reach the backend ingest port and cluster DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sensors-egress
  namespace: security-platform
spec:
  podSelector:
    matchLabels: { role: sensor }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app: backend } } }]
      ports: [{ port: 8000, protocol: TCP }]
    - to: [{ namespaceSelector: {}, podSelector: { matchLabels: { k8s-app: kube-dns } } }]
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
---
# Postgres is reachable only from the API and the worker.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: security-platform
spec:
  podSelector:
    matchLabels: { app: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: backend } }
        - podSelector: { matchLabels: { app: worker } }
      ports: [{ port: 5432, protocol: TCP }]
