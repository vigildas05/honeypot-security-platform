apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-honeypot
  namespace: security-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: http-honeypot
  template:
    metadata:
      labels:
        app: http-honeypot
    spec:
      containers:
        - name: http-honeypot
          image: http-honeypot:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: honeypot-config
            - secretRef:
                name: honeypot-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: http-honeypot
  namespace: security-platform
spec:
  type: NodePort
  selector:
    app: http-honeypot
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssh-honeypot
  namespace: security-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ssh-honeypot
  template:
    metadata:
      labels:
        app: ssh-honeypot
    spec:
      containers:
        - name: ssh-honeypot
          image: ssh-honeypot:local
          imagePullPolicy: Never
          ports:
            - containerPort: 2222
          envFrom:
            - configMapRef:
                name: honeypot-config
            - secretRef:
                name: honeypot-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: ssh-honeypot
  namespace: security-platform
spec:
  type: NodePort
  selector:
    app: ssh-honeypot
  ports:
    - port: 2222
      targetPort: 2222
      nodePort: 30022
