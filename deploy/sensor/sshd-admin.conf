# /etc/ssh/sshd_config.d/10-honeypot-admin.conf
# Real admin SSH: moved off :22 (the fake SSH sensor takes :22), keys only.
# Replace 49222 and adminuser, then: sshd -t && systemctl restart ssh
Port 49222
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
AuthenticationMethods publickey
AllowUsers adminuser
MaxAuthTries 3
LoginGraceTime 20
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
