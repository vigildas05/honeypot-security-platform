# Public sensor VM. Runs ONLY the two fake services. No database, no backend,
# no LLM or threat-intel keys: each sensor holds just its own ingest token
# (and refuses to start if a backend secret is present).
#
#   public :22 -> ssh-honeypot :2222     public :80 -> http-honeypot :8080
#
# Real admin SSH must already be moved to ADMIN_SSH_PORT before this binds :22
# (see docs/SENSOR.md). Apply firewall.sh after starting.

x-hardening: &hardening
  read_only: true
  user: "65532:65532"         # distroless "nonroot" user
  cap_drop: [ALL]             # high ports only, so no NET_BIND_SERVICE needed
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=16m,noexec,nosuid,nodev
  pids_limit: 128
  ulimits:
    nofile: { soft: 4096, hard: 4096 }
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
  networks: [sensor]

services:
  ssh-honeypot:
    <<: *hardening
    image: ${SSH_SENSOR_IMAGE:-ghcr.io/vigildas05/honeypot-ssh-sensor:latest}
    build:
      context: ../../honeypots
      dockerfile: ssh/Dockerfile
    environment:
      NODE_ENV: production
      SSH_HONEYPOT_PORT: 2222
      SENSOR_ID: ${SSH_SENSOR_ID:?set SSH_SENSOR_ID}
      SENSOR_INGEST_URL: ${SENSOR_INGEST_URL:?set SENSOR_INGEST_URL (https)}
      SENSOR_INGEST_TOKEN: ${SSH_SENSOR_TOKEN:?set SSH_SENSOR_TOKEN}
      SSH_ACCEPT_CREDENTIALS: ${SSH_ACCEPT_CREDENTIALS:-}
      SSH_FAKE_HOSTNAME: ${SSH_FAKE_HOSTNAME:-srv-web-01}
      ALLOW_INSECURE_INGEST: ${ALLOW_INSECURE_INGEST:-false}
    volumes:
      - ssh-hostkey:/data     # only writable path: the persistent host key
    ports:
      - "${PUBLIC_SSH_PORT:-22}:2222"
    mem_limit: 256m
    cpus: 0.5

  http-honeypot:
    <<: *hardening
    image: ${HTTP_SENSOR_IMAGE:-ghcr.io/vigildas05/honeypot-http-sensor:latest}
    build:
      context: ../../honeypots
      dockerfile: http/Dockerfile
    environment:
      NODE_ENV: production
      HTTP_HONEYPOT_PORT: 8080
      SENSOR_ID: ${HTTP_SENSOR_ID:?set HTTP_SENSOR_ID}
      SENSOR_INGEST_URL: ${SENSOR_INGEST_URL:?set SENSOR_INGEST_URL (https)}
      SENSOR_INGEST_TOKEN: ${HTTP_SENSOR_TOKEN:?set HTTP_SENSOR_TOKEN}
      ALLOW_INSECURE_INGEST: ${ALLOW_INSECURE_INGEST:-false}
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:8080"
    mem_limit: 192m
    cpus: 0.5

networks:
  sensor:
    driver: bridge
    enable_ipv6: false
    driver_opts:
      # The two sensors can't talk to each other; a compromise of one stays there.
      com.docker.network.bridge.enable_icc: "false"
      com.docker.network.bridge.name: "br-sensor"
    ipam:
      config:
        # Fixed so firewall.sh can scope container egress rules to it.
        - subnet: 172.30.53.0/24

volumes:
  ssh-hostkey:
