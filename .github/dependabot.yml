version: 2
updates:
  - package-ecosystem: npm
    directories: ["/backend", "/frontend", "/honeypots", "/honeypots/http", "/honeypots/ssh"]
    schedule: { interval: weekly }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: ["/backend", "/frontend", "/honeypots/http", "/honeypots/ssh"]
    schedule: { interval: weekly }
