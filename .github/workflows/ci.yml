name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (lint, types, unit + integration, injection suite)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/hp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit + integration tests
        run: npm test
      - name: Prompt-injection / agent-safety suite (offline, adversarial mock LLM)
        run: npm run test:security
      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=high

  sensors:
    name: Sensors (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: honeypots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            honeypots/package-lock.json
            honeypots/http/package-lock.json
            honeypots/ssh/package-lock.json
      - run: npm ci
      - run: npm ci --ignore-scripts
        working-directory: honeypots/http
      - run: npm ci --ignore-scripts
        working-directory: honeypots/ssh
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
        working-directory: honeypots/ssh
      - run: npm audit --omit=dev --audit-level=high
        working-directory: honeypots/http

  frontend:
    name: Dashboard (lint, XSS/CSP tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.com
      - name: Built page carries a strict CSP
        run: grep -q "script-src 'self'" dist/index.html && ! grep -q "unsafe-inline" dist/index.html
      - run: npm audit --omit=dev --audit-level=high

  scripts-and-config:
    name: Shell scripts and compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck enforcer/enforcer.sh deploy/sensor/firewall.sh deploy/sensor/update.sh
      - name: Compose files are valid
        env:
          SSH_SENSOR_ID: ci-ssh
          HTTP_SENSOR_ID: ci-http
          SENSOR_INGEST_URL: https://api.example.com/ingest/v1/events
          SSH_SENSOR_TOKEN: ci
          HTTP_SENSOR_TOKEN: ci
          POSTGRES_PASSWORD: ci
          JWT_SECRET_KEY: ci
          SENSOR_TOKENS: a:b
          DASHBOARD_ADMIN_PASSWORD: ci
          CORS_ORIGINS: https://soc.example.com
          VITE_API_BASE_URL: https://api.example.com
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f deploy/sensor/docker-compose.yml config -q
          docker compose -f deploy/backend/docker-compose.yml --profile tls config -q
      - name: Kubernetes manifests are valid
        run: docker run --rm -v "$PWD/k8s:/k8s" ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary /k8s /k8s/examples

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: backend, context: backend, file: backend/Dockerfile }
          - { name: frontend, context: frontend, file: frontend/Dockerfile }
          - { name: ssh-sensor, context: honeypots, file: honeypots/ssh/Dockerfile }
          - { name: http-sensor, context: honeypots, file: honeypots/http/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
